# Escenarios para `python -m src.scripts.eval_agent_routing` (modelo real; NO corre en la suite de tests).
# Cada uno es un mensaje de una persona con un campo cargado. Los chequeos son sobre qué reunió el agente
# (skills y herramientas, que se leen de metadata.tool_calls), cuántas llamadas al modelo usó y cómo respondió.
#   skills_any / tools_any : al menos uno de esos tuvo que usarse
#   forbid_tools           : ninguno de esos puede usarse
#   max_llm_calls          : tope de llamadas al modelo del turno (el enrutador cuenta como una)
#   forbid_text_regex      : la respuesta no puede contener esto (voseo en una respuesta de México, por ejemplo)
#   require_text_regex     : la respuesta tiene que contener esto

- id: ar-tomate-hojas-amarillas
  country: AR
  message: "las hojas de abajo de mi tomate se están poniendo amarillas"
  skills_any: [ficha-tomate, plagas-tomate]
  max_llm_calls: 3

- id: ar-riego-hoy
  country: AR
  message: "¿riego hoy la huerta?"
  tools_any: [get_irrigation_recommendation, get_forecast]
  max_llm_calls: 3

- id: ar-fertilizar-lechuga
  country: AR
  message: "¿con qué fertilizo mi lechuga y cuánto le pongo?"
  skills_any: [core-fertilizantes-y-enmiendas, ficha-lechuga]
  max_llm_calls: 3

- id: ar-producto-mosca-blanca
  country: AR
  message: "¿qué producto registrado puedo usar contra la mosca blanca del tomate?"
  skills_any: [plagas-tomate]
  tools_any: [web_search]
  max_llm_calls: 3

- id: ar-registro-riego
  country: AR
  message: "hoy regué 10 litros en la huerta"
  tools_any: [log_event]
  max_llm_calls: 3

- id: ar-saludo
  country: AR
  message: "hola, gracias"
  forbid_tools: [web_search, get_zone_satellite_status]
  max_llm_calls: 1

- id: ar-malezas-resistentes
  country: AR
  message: "el yuyo colorado no se muere con glifosato, ¿qué hago?"
  skills_any: [core-resistencia-a-herbicidas-hrac]
  max_llm_calls: 3

- id: ar-marchitez-mediodia
  country: AR
  message: "¿por qué mis lechugas se marchitan al mediodía aunque la tierra está húmeda?"
  skills_any: [fisiologia-estomas-y-transpiracion, fisiologia-agua-suelo-y-absorcion, ficha-lechuga]
  max_llm_calls: 3

- id: mx-jitomate-siembra
  country: MX
  message: "¿cuándo siembro jitomate en mi parcela?"
  skills_any: [ficha-tomate]
  tools_any: [web_search, get_forecast]
  forbid_text_regex: "\\b(vos|tenés|podés|sembrá|fijate|regá)\\b"
  max_llm_calls: 3

- id: mx-organico
  country: MX
  message: "quiero certificar mi huerto como orgánico, ¿qué necesito?"
  skills_any: [produccion-organica-vegetal-mx, huerta-organica]
  forbid_text_regex: "\\b(vos|tenés|podés|fijate)\\b"
  max_llm_calls: 3

- id: mx-mosca-blanca
  country: MX
  message: "tengo mosca blanca en mi jitomate, ¿qué hago?"
  skills_any: [plagas-tomate]
  tools_any: [web_search]
  forbid_text_regex: "\\b(vos|tenés|podés|fijate)\\b"
  max_llm_calls: 3

- id: mx-plaguicidas-seguridad
  country: MX
  message: "voy a aplicar un insecticida con mochila, ¿qué precauciones debo tomar?"
  skills_any: [core-uso-y-manejo-de-plaguicidas-mx]
  forbid_text_regex: "\\b(vos|tenés|podés|fijate)\\b"
  max_llm_calls: 3
