version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agroai_postgres
    environment:
      POSTGRES_USER: genai_user
      POSTGRES_PASSWORD: genai_password
      POSTGRES_DB: genai_reports_db
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_user -d genai_reports_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agroai_network

  # TimescaleDB (PostgreSQL with TimescaleDB extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: agroai_timescaledb
    environment:
      POSTGRES_USER: genai_user
      POSTGRES_PASSWORD: genai_password
      POSTGRES_DB: genai_reports_db
    ports:
      - "54320:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_user -d genai_reports_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agroai_network

  # AgroAI Application
  app:
    build: .
    container_name: agroai_app
    environment:
      - DATABASE_URL=postgresql+asyncpg://genai_user:genai_password@postgres:5432/genai_reports_db
      - TIMESCALE_URL=postgresql+asyncpg://genai_user:genai_password@timescaledb:5432/genai_reports_db
      - DEV_MODE=true
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - agroai_network
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  timescaledb_data:

networks:
  agroai_network:
    driver: bridge