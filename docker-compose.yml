# AgroAI: one Python image (api + batch worker) and one PostgreSQL with TimescaleDB + pgvector.
#   cp .env.example .env   # set AUTH_SECRET_KEY, CREDENTIALS_ENCRYPTION_KEY, OPENWEATHER_API_KEY
#   docker compose up --build
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agroai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agroai}
      POSTGRES_DB: ${POSTGRES_DB:-agroai}
    ports:
      - "127.0.0.1:${DB_PORT:-54321}:5432"  # dev credentials: reachable from this machine only
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD:-agroai}@db:5432/${POSTGRES_DB:-agroai}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD:-agroai}@db:5432/${POSTGRES_DB:-agroai}
      BASE_DATA_PATH: /data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "src.batch", "smn", "--every-hours", "${SMN_INTERVAL_HOURS:-6}"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD:-agroai}@db:5432/${POSTGRES_DB:-agroai}
      SMN_GRID_CACHE_DIR: /data/smn_cache
      BASE_DATA_PATH: /data/uploads
    volumes:
      - smn_cache:/data/smn_cache
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Due reminders -> in-app notifications. Light: one query every few minutes.
  reminders:
    build: .
    command: ["python", "-m", "src.batch", "reminders", "--every-minutes", "${REMINDERS_INTERVAL_MINUTES:-5}"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD:-agroai}@db:5432/${POSTGRES_DB:-agroai}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Copernicus satellite series: backfill + new passes for every field, then series-based alerts. Does
  # nothing until SATELLITE_INGEST_ENABLED=true (measure the real cost first: src/scripts/copernicus_measure.py).
  satellite:
    build: .
    command: ["python", "-m", "src.batch", "satellite", "--every-hours", "${SATELLITE_INTERVAL_HOURS:-24}"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD:-agroai}@db:5432/${POSTGRES_DB:-agroai}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
  smn_cache:
