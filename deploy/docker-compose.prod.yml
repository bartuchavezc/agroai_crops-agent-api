# Production compose for the droplet. Only pulls pre-built images (built by GitHub Actions, see
# ../.github/workflows/deploy.yml) — nothing is built on the droplet itself (1 vCPU / 1GB RAM, building
# Next.js or even `uv sync` there is a real OOM/slowness risk). The frontend is NOT here: it's deployed
# separately on Vercel.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# Redeploy after a new image is published: `docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d`
# Daily SMN job (cron on the host, not a resident container): `docker compose -f docker-compose.prod.yml run --rm worker`
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agroai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agroai}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ghcr.io/bartuchavezc/agroai_crops-agent-api:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agroai}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/bartuchavezc/agroai_crops-agent-api:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agroai}
      BASE_DATA_PATH: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  worker:
    image: ghcr.io/bartuchavezc/agroai_crops-agent-api:latest
    command: ["python", "-m", "src.batch", "smn"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agroai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agroai}
      SMN_GRID_CACHE_DIR: /data/smn_cache
      # Same mount as `api`: the batch now also touches StorageService (satellite post-storm check),
      # and the image's default BASE_DATA_PATH (/app/data/uploads) isn't writable in the container.
      BASE_DATA_PATH: /data/uploads
    volumes:
      - smn_cache:/data/smn_cache
      - uploads:/data/uploads
    profiles: ["cron"]  # never started by `up`; only invoked explicitly (see host crontab)

volumes:
  pgdata:
  uploads:
  smn_cache:
  caddy_data:
  caddy_config:
