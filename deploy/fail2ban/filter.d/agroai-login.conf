# Failed logins against the AgroAI API, read from Caddy's JSON access log (deploy/Caddyfile).
#
# A line counts when Caddy answered 401 to POST /api/v1/auth/login. The regex is anchored on the fixed
# fields Caddy writes before the request headers (remote_ip … uri), and on "status" after them. Header
# values are client-controlled, but Caddy JSON-escapes them (\"), so they can't fake an unescaped
# "remote_ip":"…" or "status":401 and get someone else banned.
#
# remote_ip is the TCP peer as Caddy sees it, which is the real client: Caddy is the edge, and Docker
# delivers external traffic to the container by DNAT (source IP preserved).

[Definition]
# (fail2ban strips the matched "ts" date from the line before applying this, so the regex starts after it)
failregex = "logger":"http\.log\.access[^"]*","msg":"handled request","request":\{"remote_ip":"<HOST>","remote_port":"\d+","client_ip":"[^"]*","proto":"[^"]*","method":"POST","host":"[^"]*","uri":"/api/v1/auth/login(?:\?[^"]*)?",.*,"status":401,"resp_headers":

ignoreregex =

# Caddy writes "ts" as Unix epoch seconds with a fraction.
datepattern = "ts":{EPOCH}
