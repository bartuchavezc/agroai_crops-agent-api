[project]
name = "agroai-crops-agent"
version = "0.3.0"
description = "AgroAI Crops Agent - Gemini (BYOK) agronomic assistant"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.20",
    "pydantic[email]>=2.13",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "dependency-injector>=4.46",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pgvector>=0.5",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.5",
    "cryptography>=45",
    "google-genai>=2.25",
    "google-adk>=2.10,<3",
    "aiohttp>=3.9",
    "pillow>=11",
    "numpy>=2.0",
    "xarray>=2025.4",
    "h5netcdf>=1.6",
    "h5py>=3.12",
    "s3fs>=2025.5",
    "pyshp>=3.1.6",
    "tifffile>=2026.9.20",
    "pygeomag>=1.1.0",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008"]  # FastAPI Depends(...) defaults

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
