[tool.poetry]
name = "agroai-crops-agent"
version = "0.2.0"
description = "AgroAI Crops Agent - AI-powered precision agronomic assistant"
authors = ["AgroAI Team <team@agroai.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
python-dotenv = "^1.0.0"
numpy = ">=1.26.0,<2.0.0"
pillow = "^10.0.0"
dependency-injector = "^4.46.0"
ollama = "^0.4.8"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.41"}
pydantic = {extras = ["email"], version = "^2.11.5"}
asyncpg = "^0.29.0"
fastapi = "^0.103.2"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
python-multipart = "^0.0.6"
pyyaml = "^6.0.2"
langchain = "^0.1.0"
langchain-core = "^0.1.0"
langchain-community = "^0.0.30"
email-validator = "^2.2.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
redis = {extras = ["hiredis"], version = "^6.2.0"}
timescale = "^0.0.8"
s3fs = "^2025.5.1"  # Weather data from S3
xarray = "^2025.4.0"  # Weather data processing
aiohttp = "^3.9.0"  # Async HTTP client
elasticsearch = {extras = ["async"], version = "^8.0.0"}  # Two-stage search backend

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.1.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "src.main:create_app" 